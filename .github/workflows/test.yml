name: test

on:
  push:
    branches:
      - master
      - main
  pull_request:
  # The release workflow calls this job and gates publish on the result.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.18.0"
          rebar3-version: "3"
          # elixir-version: "1"
      # The host tests, the CLI and the extension all run on node.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      # A release ships one version. This check fails when any manifest
      # disagrees.
      - run: ./scripts/check-version.sh

      # The rule engine.
      - run: gleam deps download
      - run: gleam test
      - run: gleam format --check src test

      # The host tests and the CLI import dist/, so build it first.
      - run: ./scripts/build-dist.sh
      - run: node --test "test/host/*.test.mjs"

      # Our own prose obeys the same rules. The `lint` script names the files,
      # so this job and a local run always read the same list.
      - run: npm run lint
